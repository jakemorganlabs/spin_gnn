[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spin_gnn"
version = "0.1.0"
description = "Small SO(3)-equivariant GNN with one controller node and 16 spinning satellites in a unit cube"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pydantic>=2.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pyright>=1.1.380",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["spin_gnn*"]

[tool.pytest.ini_options]
testpaths = ["spin_gnn/tests"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["spin_gnn"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
